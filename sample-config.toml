# Main qBittorrent client configuration (where FUSE mount is connected)
[qbittorrent]
url = "http://127.0.0.1:8080/"
username = "your_username"
password = "your_password"

# Optional custom requests connection parameters (e.g. Basic Auth for Nginx proxy)
[qbittorrent.requests_args]
auth = ["nginx_user", "nginx_password"]


# Directory paths configuration for syncthing, downloads, and mounts
[paths]
# Folder monitored by torrent_sync.py for newly matching .torrent files to download
watch_dir = "/path/to/watch_dir"

# Folder where processed .torrent files are archived
completed_dir = "/path/to/completed_dir"

# Local fast storage path (e.g., SSD) for initial downloading of active batches
local_save_path = "/path/to/qbittorrent_local_downloads/"

# Mount path of the rclone FUSE directory where files are seeded remotely
remote_save_path = "/path/to/rclone_fuse_mount/"

# qBittorrent category assigned to local SSD downloading batches
category = "SSD"

# qBittorrent category assigned to remote seeding torrents pointing to FUSE path
remote_category = "remote"


# Automated sync daemon performance and limitation boundaries
[settings]
# Maximum allowed disk space occupied by local downloads on the SSD (in GB)
ssd_limit_gb = 35.0

# Time to wait (in minutes) after local download completes before moving via rclone
wait_time_minutes = 2.0

# Sleep interval duration (seconds) between local loop cycles
poll_interval_seconds = 10
  
  # Interval (seconds) between dangling tracker mapping sweeps (defaults to 600 seconds/10 minutes)
  sweep_interval_seconds = 600

# Duration to wait (seconds) after rclone move before adding to remote client, verifying mount updates
fuse_cooldown_seconds = 15

# Maximum number of simultaneous active downloading torrents allowed on SSD
max_active_downloads = 3

# --- LOGGING SETTINGS ---
# log_level: Logging level for the log files ("DEBUG", "INFO", "WARNING", "ERROR").
# DEBUG writes all API calls and raw responses to files, which is extremely helpful for debugging.
log_level = "DEBUG"

# console_log_level: Logging level for the console / CLI output ("INFO", "WARNING", "ERROR").
# Set this to "WARNING" or "ERROR" to keep the CLI output clean and uncluttered.
console_log_level = "INFO"

# Filenames for the output log files (will be written to current working directory)
torrent_sync_log_file = "data/torrent_sync.log"
racing_link_log_file = "data/racing_link.log"


# Rclone file migration settings
[rclone]
# Name of the rclone remote and destination subpath configured in rclone.conf
remote = "remote_name:path/"

# Number of concurrent file transfers parameter passed to rclone (--transfers)
transfers = 2

# Maximum number of parallel rclone move background jobs allowed to run concurrently
max_parallel_jobs = 2


# Optional Telegram bot notifications configuration
[telegram]
enabled = false
bot_token = "YOUR_TELEGRAM_BOT_TOKEN"
chat_id = "YOUR_TELEGRAM_CHAT_ID"

# Optional separate chat ID for oversized movie warnings (falls back to chat_id if empty)
oversized_chat_id = "YOUR_OVERSIZED_CHAT_ID"

# Optional separate chat ID for search timeout logs (falls back to chat_id if empty)
not_found_chat_id = "YOUR_NOT_FOUND_CHAT_ID"


# Secondary client configuration (dedicated racing instance, e.g. qBittorrent or Deluge)
[racing_client]
# Set "type" to "qbittorrent" or "deluge" (defaults to "qbittorrent" if omitted)
type = "deluge"

# --- Deluge WebUI configuration ---
url = "http://127.0.0.1:8112/"
password = "your_deluge_webui_password"

# Optional: Deluge state directory (where .torrent files are stored).
# If provided, the daemon will securely read .torrent files from this folder to skip Prowlarr fallback searches.
# If your racing client is on the same machine (or mounted via Syncthing), this is a local path:
# state_dir = "/home/kevin/.config/deluge/state"

# --- Remote Deluge VPS Fetching (SSH/SCP) ---
# If your racing Deluge is on a remote VPS and you are NOT using Syncthing, you can provide SSH details.
# The daemon will securely fetch the .torrent files via SCP. 'state_dir' above must be set to the remote path.
# ssh_host = "your.vps.ip.address"
# ssh_user = "root"
# ssh_key_path = "/home/kevin/.ssh/id_rsa"
# ssh_key_password = "your_key_passphrase_here" # Optional, if your key is encrypted
# ssh_port = 22

# Optional: Nginx Basic Auth credentials (supported by both Deluge and qBittorrent wrappers)
# [racing_client.requests_args]
# auth = ["nginx_user", "nginx_password"]

# --- OR qBittorrent WebUI configuration (uncomment if using qBittorrent instead) ---
# type = "qbittorrent"
# url = "http://127.0.0.1:8081/"
# username = "your_racing_username"
# password = "your_racing_password" 


# Prowlarr API search credentials
[prowlarr]
url = "http://127.0.0.1:9696/"
api_key = "YOUR_PROWLARR_API_KEY"

# The name of the local/long-term tracker indexer in Prowlarr (where home server downloads the matched torrent)
indexer_name = "local"

# Optional: The name of the racing tracker indexer in Prowlarr (used as a fallback to download the racing .torrent file for remote migration if the racing client doesn't support direct file exporting, e.g. Deluge)
# racing_indexer_name = "racing"
  
  # Optional: Map tracker domains/sub-strings (from tracker_filters) to their Prowlarr indexer names.
  # This is used as a fallback to fetch the .torrent file for remote migration when the racing client is Deluge.
  [prowlarr.racing_indexer_map]
  aither = "Aither"
  beyond-hd = "Beyond-HD"
  bhd = "Beyond-HD"


# Bridge daemon racing parameters
[racing_settings]
# Bridge daemon cycle sleep interval (seconds)
poll_interval_seconds = 60

# Sub-string filter matching trackers of torrents to race on the racing client
# Sub-string filter matching trackers of torrents to race on the racing client (old setting, single tracker)
  # tracker_filter = "tracker_domain.com"
  
  # List of sub-string filters matching trackers of torrents to race on the racing client
  tracker_filters = ["aither", "beyond-hd", "bhd"]
  
  # Keywords to identify a matching public torrent in the racing client (e.g. for magnet fallback)
  public_tracker_keywords = ["nyaa", "opentrackr", "mywaifu"]

# Maximum time (hours) to keep searching Prowlarr before timing out/notifying
max_search_age_hours = 24

# Time (minutes) to wait between Prowlarr searches for a specific pending torrent
search_interval_minutes = 15

# Minimum spacing delay (seconds) enforced globally between Prowlarr indexer queries
search_gap_seconds = 180

# Visual tag/category applied on racing client for migrated torrents, marking them safe for deletion
completed_category = "processed"
